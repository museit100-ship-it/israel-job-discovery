name: Daily job discovery

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover.yml'
      - 'discover.rb'
      - 'sources.json'

permissions:
  contents: write

concurrency:
  group: job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect vacancies
        id: collect
        continue-on-error: true
        run: ruby discover.rb
      - name: Save feed and source status
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public jobs feed'
            git push
          fi
      - name: Report collection failures
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
