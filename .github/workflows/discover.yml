name: Daily job discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write

concurrency:
  group: job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    if: github.run_attempt == '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: expanded-job-discovery
      - name: Collect vacancies
        id: collect
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: timeout --signal=KILL 10m ruby discover.rb
      - name: Save feed and source status
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public jobs feed'
            git push origin HEAD:refs/heads/expanded-job-discovery
          fi
      - name: Report collection failures
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
